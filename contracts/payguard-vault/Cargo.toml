[package]
name = "payguard-vault"
version = "0.3.0"
authors = ["PAYGUARD Security Team <security@payguard.near>"]
edition = "2021"
description = "PAYGUARD Intelligent Security Vault for Autonomous AI Agents on NEAR Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = ["legacy", "unit-testing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

