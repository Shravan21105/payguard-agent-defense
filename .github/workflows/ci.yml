name: PAYGUARD CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  frontend-verification:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: TypeScript & Vite Production Build
        run: npm run build

      - name: Verify Production Dist Output
        run: |
          test -f dist/index.html || exit 1
          echo "Production build succeeded with valid dist/index.html"

  backend-verification:
    name: Backend Test Suite (120 Tests) & Policy Engine Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Full Pytest Suite (Phases 1-7 Verification)
        run: |
          pytest -v --tb=short backend/tests

  smart-contract-verification:
    name: Rust NEAR Smart Contract WASM Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Smart Contract WASM
        run: |
          cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/payguard-vault/Cargo.toml

      - name: Verify WASM Binary Artifact
        run: |
          WASM_FILE="contracts/payguard-vault/target/wasm32-unknown-unknown/release/payguard_vault.wasm"
          test -f "$WASM_FILE" || exit 1
          SIZE=$(wc -c < "$WASM_FILE")
          echo "WASM Binary generated: $SIZE bytes"
          if [ "$SIZE" -gt 600000 ]; then
            echo "Warning: WASM size exceeds recommended 600KB budget"
          fi

