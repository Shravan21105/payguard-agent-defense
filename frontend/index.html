<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAYGUARD — Agent Defense Layer | Autonomous Transaction Security</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('payguard-theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
